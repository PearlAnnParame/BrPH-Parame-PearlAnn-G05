{% if page.paginator.num_pages > 1 %}
<p class="muted" style="margin-top:1rem">
  {% if page.has_previous %}<a href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}page={{ page.previous_page_number }}">&laquo; Previous</a>{% endif %}
  Page {{ page.number }} of {{ page.paginator.num_pages }} ({{ page.paginator.count }} requests)
  {% if page.has_next %}<a href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}page={{ page.next_page_number }}">Next &raquo;</a>{% endif %}
</p>
{% endif %}
