<div class="card req-row" style="background:#f9fafb">
  {% for hidden in f.hidden_fields %}{{ hidden }}{% endfor %}
  {{ f.non_field_errors }}
  {% for field in f.visible_fields %}
    {% if field.name == "is_mandatory" %}<label><input type="checkbox" name="{{ field.html_name }}" id="{{ field.id_for_label }}" {% if field.value %}checked{% endif %}> Mandatory</label>
    {% elif field.name == "DELETE" %}<label><input type="checkbox" name="{{ field.html_name }}" id="{{ field.id_for_label }}"> Remove this requirement</label>
    {% else %}{% include "documents/_field.html" with field=field %}{% endif %}
  {% endfor %}
</div>
